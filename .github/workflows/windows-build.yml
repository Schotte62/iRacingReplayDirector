name: Windows build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore dependencies
        run: nuget restore iRacingReplayDirectorApps.sln

      - name: Build solution
        run: msbuild iRacingReplayDirectorApps.sln /m /p:Configuration=Debug /p:Platform="Any CPU" /verbosity:minimal

      - name: Prepare downloadable Windows files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'bin/Debug'
          $package = 'windows-package'
          $pluginSource = 'bin/x64/Debug/plugins'
          if (!(Test-Path "$source/iRacingReplayDirector.exe")) {
            throw 'The application executable is missing.'
          }
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item "$source/*" $package -Recurse -Force
          foreach ($plugin in @(
            @{ Folder = 'iRacingDirector.Plugin.StandardOverlays'; Dll = 'StandardOverlays.dll' },
            @{ Folder = 'JockeOverlays'; Dll = 'JockeOverlays.dll' },
            @{ Folder = 'NoOverlay'; Dll = 'NoOverlay.dll' }
          )) {
            $folder = "$pluginSource/$($plugin.Folder)"
            if (!(Test-Path "$folder/$($plugin.Dll)") -or
                !(Test-Path "$folder/iRacingDirector.Plugin.Support.dll")) {
              throw "Required plugin files are missing from $folder"
            }
            New-Item -ItemType Directory -Force -Path "$package/plugins/$($plugin.Folder)" | Out-Null
            Copy-Item "$folder/*.dll" "$package/plugins/$($plugin.Folder)/" -Force
          }

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: iRacingReplayDirector-Windows
          path: windows-package/
          if-no-files-found: error
          retention-days: 14
