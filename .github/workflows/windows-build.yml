name: Windows build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore dependencies
        run: nuget restore iRacingReplayDirectorApps.sln

      - name: Build solution
        run: msbuild iRacingReplayDirectorApps.sln /m /p:Configuration=Debug /p:Platform="Any CPU" /verbosity:minimal

      - name: Prepare downloadable Windows files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'bin/Debug'
          $package = 'windows-package'
          $pluginSupport = 'plugins/iRacingDirector.Plugin.Support/iRacingDirector.Plugin.Support/bin/Debug/iRacingDirector.Plugin.Support.dll'
          if (!(Test-Path $pluginSupport)) {
            throw 'The shared plugin support DLL is missing.'
          }
          if (!(Test-Path "$source/iRacingReplayDirector.exe")) {
            throw 'The application executable is missing.'
          }
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item "$source/*" $package -Recurse -Force
          foreach ($plugin in @(
            @{ Folder = 'StandardOverlays'; Source = 'iRacingDirector.Plugin.StandardOverlays'; Dll = 'StandardOverlays.dll' },
            @{ Folder = 'JockeOverlays'; Source = 'JockeOverlays'; Dll = 'JockeOverlays.dll' },
            @{ Folder = 'NoOverlay'; Source = 'NoOverlay'; Dll = 'NoOverlay.dll' }
          )) {
            $dll = "plugins/$($plugin.Source)/bin/Debug/$($plugin.Dll)"
            if (!(Test-Path $dll)) {
              throw "Required plugin file is missing: $dll"
            }
            $destination = "$package/plugins/$($plugin.Folder)"
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            Copy-Item $dll $destination -Force
            Copy-Item $pluginSupport $destination -Force
          }

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: iRacingReplayDirector-Windows
          path: windows-package/
          if-no-files-found: error
          retention-days: 14
