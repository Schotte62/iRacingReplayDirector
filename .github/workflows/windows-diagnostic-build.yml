name: Windows diagnostic build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Restore packages
        run: nuget restore iRacingReplayDirectorApps.sln
      - name: Build director
        run: msbuild iRacingReplayDirector.csproj /p:Configuration=Release /p:Platform=x64 /p:GenerateManifests=false
      - name: Save test build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: replay-director-diagnostic
          path: bin/Release/
